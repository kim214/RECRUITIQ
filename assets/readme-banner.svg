<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="RecruitIQ">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="55%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="iq" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- Decorative circles -->
  <circle cx="980" cy="60" r="120" fill="#ffffff" opacity="0.06"/>
  <circle cx="1100" cy="260" r="90" fill="#ffffff" opacity="0.05"/>
  <circle cx="80" cy="280" r="70" fill="#ffffff" opacity="0.05"/>

  <!-- Logo mark -->
  <g transform="translate(72, 88)" filter="url(#shadow)">
    <rect width="88" height="88" rx="22" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
    <rect x="10" y="10" width="68" height="68" rx="16" fill="url(#bg)"/>
    <path d="M30 52c0-11 9-20 20-20s20 9 20 20" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="42" cy="40" r="4" fill="#fff"/>
    <circle cx="58" cy="40" r="4" fill="#fff"/>
    <path d="M36 62h32" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <circle cx="62" cy="28" r="9" fill="#06b6d4" stroke="#fff" stroke-width="2"/>
    <path d="M59 28l2.5 2.5 5-5.5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text x="190" y="138" font-family="Segoe UI, system-ui, sans-serif" font-size="56" font-weight="800" fill="#ffffff">Recruit</text>
  <text x="190" y="138" font-family="Segoe UI, system-ui, sans-serif" font-size="56" font-weight="800" fill="url(#iq)" dx="248">IQ</text>

  <!-- Tagline -->
  <text x="192" y="182" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="500" fill="#ffffff" opacity="0.92">
    Intelligent recruitment, built for decisions that matter.
  </text>

  <!-- Pill badges -->
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600">
    <rect x="192" y="210" width="118" height="34" rx="17" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.28"/>
    <text x="212" y="232" fill="#ffffff">AI Rankings</text>

    <rect x="322" y="210" width="148" height="34" rx="17" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.28"/>
    <text x="342" y="232" fill="#ffffff">Document Analysis</text>

    <rect x="482" y="210" width="130" height="34" rx="17" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.28"/>
    <text x="502" y="232" fill="#ffffff">Smart Hiring</text>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="312" width="1200" height="8" fill="#10b981" fill-opacity="0.85"/>
</svg>
